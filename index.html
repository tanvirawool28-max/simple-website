<!DOCTYPE html>
<html>
<head>
    <title>Fake Friends Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
            color: white;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
        }

        .card {
            background: white;
            color: #222;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 90%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #7b2ff7;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #5b1fd1;
        }

        #quiz {
            display: none;
        }

        .question {
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
        }

        .option {
            margin: 10px 0;
            background: #f1f1f1;
            color: #222;
        }

        .result {
            display: none;
        }

        .score {
            font-size: 45px;
            font-weight: bold;
            color: #7b2ff7;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div class="card" id="home">

        <h1>😈 Fake Friends Quiz</h1>

        <p>
            How well do your friends really know you?
        </p>

        <p>
            Create your quiz and see who knows you best!
        </p>

        <input type="text" id="name" placeholder="Enter your name">

        <button onclick="startQuiz()">
            Create My Quiz
        </button>

    </div>


    <!-- QUIZ -->
    <div class="card" id="quiz">

        <h2 id="welcome"></h2>

        <div class="question" id="question">
            Question
        </div>

        <button class="option" onclick="answer(0)" id="option1">
            Option 1
        </button>

        <button class="option" onclick="answer(1)" id="option2">
            Option 2
        </button>

        <button class="option" onclick="answer(2)" id="option3">
            Option 3
        </button>

    </div>


    <!-- RESULT -->
    <div class="card result" id="result">

        <h1>🎉 Quiz Complete!</h1>

        <p id="resultText"></p>

        <div class="score" id="score">
            0%
        </div>

        <p>
            Thanks for playing!
        </p>

        <button onclick="location.reload()">
            Play Again
        </button>

    </div>

</div>


<script>

let currentQuestion = 0;
let score = 0;

let questions = [

    {
        question: "What is my favourite color?",
        options: ["Black", "Blue", "Pink"],
        correct: 1
    },

    {
        question: "What do I like more?",
        options: ["Music", "Sports", "Gaming"],
        correct: 2
    },

    {
        question: "What would I choose?",
        options: ["Pizza", "Burger", "Noodles"],
        correct: 1
    },

    {
        question: "What is my favourite time?",
        options: ["Morning", "Afternoon", "Night"],
        correct: 3
    }

];


function startQuiz() {

    let name = document.getElementById("name").value;

    if (name == "") {
        alert("Please enter your name!");
        return;
    }

    document.getElementById("home").style.display = "none";

    document.getElementById("quiz").style.display = "block";

    document.getElementById("welcome").innerText =
        "Hi " + name + "! Answer these questions:";

    showQuestion();
}


function showQuestion() {

    let q = questions[currentQuestion];

    document.getElementById("question").innerText =
        q.question;

    document.getElementById("option1").innerText =
        q.options[0];

    document.getElementById("option2").innerText =
        q.options[1];

    document.getElementById("option3").innerText =
        q.options[2];
}


function answer(selected) {

    if (selected == questions[currentQuestion].correct) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }
}


function showResult() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    let percentage =
        Math.round((score / questions.length) * 100);

    document.getElementById("score").innerText =
        percentage + "%";

    document.getElementById("resultText").innerText =
        "You got " + score + " out of " +
        questions.length + " questions correct.";

}

</script>

</body>
</html>
